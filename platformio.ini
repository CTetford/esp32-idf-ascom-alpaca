[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = espidf
build_type = release

; ESP-IDF specific settings
monitor_speed = 115200

; Enable Ethernet
board_build.embed_txtfiles =
    sdkconfig.esp32eth       ; For ESP32 Ethernet configuration

; Add required components for the project
; This might need adjustment as we add more specific dependencies
build_flags =
    -D CONFIG_ETH_USE_SPI_ETHERNET=n
    -D CONFIG_ETH_USE_OPENETH=y
    ; Add other necessary components for networking, mcpwm, pcnt, etc.
    ; For example, if using specific menuconfig options, they can be represented here
    ; or in the sdkconfig files.

lib_deps =
    ; cJSON is usually part of ESP-IDF, but if needed explicitly:
    ; espressif/cJSON
    ; For MQTT, a common choice is:
    ; 256dpi/MQTT @ ^2.5.0
    ; However, ESP-IDF also has an MQTT client component.
    ; We'll start without explicit MQTT lib_deps and use IDF's component first.

; Custom sdkconfig defaults can be placed in files like 'sdkconfig.defaults'
; For Ethernet on WT32-ETH01, specific sdkconfig settings are crucial.
; We are using sdkconfig.esp32eth to manage these.
